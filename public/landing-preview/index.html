<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#252126">
  <title>BizBox — Test business decisions before committing.</title>
  <meta name="description" content="Explore locations for your service business.">
  <meta property="og:title" content="BizBox — Test business decisions before committing.">
  <meta property="og:image" content="https://usebizbox.app/landing-preview/assets/product-screen.jpg">
  <link rel="preload" href="/landing-preview/assets/houston-sunset.jpg" as="image">
  <link rel="icon" href="/icon" type="image/png" sizes="64x64">
  <link rel="stylesheet" href="/landing-preview/style.css">
</head>
<body>
  <svg class="filter-defs" aria-hidden="true" focusable="false"><defs><filter id="glass-refraction" x="-4%" y="-12%" width="108%" height="124%" color-interpolation-filters="sRGB"><feImage id="glass-displacement" x="0" y="0" width="100%" height="100%" preserveAspectRatio="none" result="rim-map"/><feDisplacementMap in="SourceGraphic" in2="rim-map" scale="5" xChannelSelector="R" yChannelSelector="G"/></filter></defs></svg>
  <a class="skip-link" href="#location">Skip to the product</a>
  <div class="world" aria-hidden="true">
    <div class="photo-fallback" id="photo-fallback"></div>
    <canvas id="scene"></canvas>
    <div class="scene-shade"></div>
  </div>

  <header class="topbar glass">
    <a class="brand" href="/" aria-label="BizBox home">
      <img src="/landing-preview/assets/bizbox-logo.png" alt="" width="36" height="36">
      <span>BizBox</span>
    </a>
    <a class="nav-cta demo-link" href="/start">Try a demo <span aria-hidden="true">↗</span></a>
  </header>

  <div class="story-copy" id="story-copy">
    <h1 id="story-title">Test business decisions before committing.</h1>
  </div>

  <div class="product-shell" id="product-shell" hidden>
    <div class="product-window glass" id="product-window" role="region" aria-label="BizBox product preview">
      <img class="screen-poster" src="/landing-preview/assets/product-screen.jpg" alt="BizBox product preview" id="screen-poster">
      <iframe id="app-frame" title="BizBox interactive demo" loading="lazy" referrerpolicy="strict-origin-when-cross-origin" tabindex="-1" hidden></iframe>
      <iframe id="tour-frame" title="Matterport sample space tour" loading="lazy" referrerpolicy="strict-origin-when-cross-origin" allow="fullscreen; xr-spatial-tracking" allowfullscreen tabindex="-1" hidden></iframe>
      <div class="frame-loading" id="frame-loading" role="status" hidden>Loading preview…</div>
      <div class="frame-empty" id="frame-empty" role="status" hidden>Preview unavailable</div>
    </div>
    <div class="surface-controls" id="surface-controls" hidden>
      <button class="explore-control glass" id="explore-control" type="button" aria-pressed="false" aria-controls="product-window">Explore space <span aria-hidden="true">↗</span></button>
      <a class="source-context" id="tour-source" target="_blank" rel="noopener noreferrer" hidden>Matterport demo <span aria-hidden="true">↗</span></a>
    </div>
  </div>

  <div class="finish" id="finish" hidden>
    <a class="final-cta glass demo-link" href="/start">Try a demo <span aria-hidden="true">↗</span></a>
    <a class="workspace-link" href="/start">Already started? Open your workspace</a>
  </div>

  <nav class="progress-nav glass" aria-label="Explore BizBox">
    <span class="progress-selection" aria-hidden="true"></span>
    <a href="#start" data-step="0" aria-label="1. Test business decisions before committing" aria-current="step"><span></span></a>
    <a href="#location" data-step="1" aria-label="2. Find a location"><span></span></a>
    <a href="#space" data-step="2" aria-label="3. Walk through the space"><span></span></a>
    <a href="#day" data-step="3" aria-label="4. See a business day unfold"><span></span></a>
    <a href="#compare" data-step="4" aria-label="5. Add a counter. Compare results"><span></span></a>
    <a href="#demo" data-step="5" aria-label="6. Test your next decision"><span></span></a>
  </nav>

  <main id="journey" aria-label="BizBox introduction">
    <section class="chapter" id="start" aria-label="Test business decisions before committing"></section>
    <section class="chapter" id="location" aria-label="Find a location"></section>
    <section class="chapter" id="space" aria-label="Walk through the space"></section>
    <section class="chapter" id="day" aria-label="See a business day unfold"></section>
    <section class="chapter" id="compare" aria-label="Add a counter. Compare results"></section>
    <section class="chapter" id="demo" aria-label="Test your next decision"></section>
  </main>
  <p class="sr-only" id="scene-status" aria-live="polite">Test business decisions before committing.</p>
  <noscript><p class="no-script">BizBox needs JavaScript for the product preview.</p></noscript>
  <script type="module" src="/landing-preview/app.js"></script>
</body>
</html>
