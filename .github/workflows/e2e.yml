name: E2E

on:
  pull_request:

permissions:
  contents: read

# HAC-132: the whole suite takes about 20 minutes on one runner, so each Playwright project
# runs as its own job (about 5-8 minutes each). The `e2e` job at the bottom keeps the
# required-check name stable: it passes only when every project job passed.
jobs:
  project:
    name: e2e (${{ matrix.project }})
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - project: chromium
            browser: chromium
          - project: webkit
            browser: webkit
          - project: mobile-chrome
            browser: chromium
          - project: api
            browser: ""
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Install browser
        if: matrix.browser != ''
        run: pnpm exec playwright install --with-deps ${{ matrix.browser }}
      - name: Run ${{ matrix.project }} specs
        env:
          BIZBOX_MEDIA_DIAGNOSTIC: ${{ matrix.project == 'webkit' && '1' || '0' }}
        run: pnpm exec playwright test --project=${{ matrix.project }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report-${{ matrix.project }}
          path: playwright-report/
          retention-days: 14

  # Temporary comparison probe; removed before this branch is merged.
  # Existing project jobs and the required aggregate gate are unchanged.
  media-probe:
    name: WebKit media probe (load=${{ matrix.forceLoad }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        forceLoad: ["0", "1"]
    env:
      BIZBOX_MEDIA_DIAGNOSTIC: "1"
      BIZBOX_MEDIA_FORCE_LOAD: ${{ matrix.forceLoad }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps webkit
      - name: Compare native media loading
        run: pnpm exec playwright test tests/e2e/landing-prepared-media.spec.ts --project=webkit --grep 'Save Data|autoplay rejection' --repeat-each=3 --workers=2 --retries=0
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: webkit-media-probe-${{ matrix.forceLoad }}
          path: playwright-report/
          retention-days: 3

  e2e:
    name: e2e
    needs: project
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Every project passed
        env:
          RESULT: ${{ needs.project.result }}
        run: |
          echo "e2e project jobs: $RESULT"
          test "$RESULT" = "success"
