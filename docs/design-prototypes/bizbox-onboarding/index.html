<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <title>BizBox · Plan your business</title>
    <link rel="stylesheet" href="styles.css" />
    <link rel="stylesheet" href="la-glass.css" />
    <link rel="stylesheet" href="dark-glass.css?v=1" />
    <link rel="stylesheet" href="liquid-motion.css?v=1" />
    <link rel="stylesheet" href="refinement.css?v=1" />
    <link rel="stylesheet" href="smooth.css?v=1" />
    <link rel="stylesheet" href="pool.css?v=1" />
    <link rel="stylesheet" href="simple.css?v=1" />
    <link rel="stylesheet" href="workspace.css?v=1" />
  </head>
  <body>
    <div class="world" aria-hidden="true">
      <div class="la-scene"></div>
      <div class="atmosphere"></div>
    </div>
    <header class="masthead">
      <a class="brand" href="?step=category" aria-label="BizBox onboarding"
        ><span class="brand-symbol"
          ><svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <path
              d="m5 15 7-10 7 10-7 4-7-4Z"
              stroke="currentColor"
              stroke-width="1.5"
            />
            <path
              d="m5 15 7-4 7 4M12 5v6"
              stroke="currentColor"
              stroke-width="1.5"
            /></svg></span
        >BizBox<span class="brand-dot">.</span></a
      >
      <div class="material-switch" role="group" aria-label="Mockup material">
        <button data-theme="day" aria-pressed="true">
          <svg
            viewBox="0 0 20 20"
            fill="none"
            stroke="currentColor"
            aria-hidden="true"
          >
            <circle cx="10" cy="10" r="3" />
            <path
              d="M10 1v2m0 14v2M1 10h2m14 0h2M3.6 3.6 5 5m10 10 1.4 1.4M3.6 16.4 5 15M15 5l1.4-1.4"
            /></svg
          >Daylight</button
        ><button data-theme="night" aria-pressed="false">
          <svg
            viewBox="0 0 20 20"
            fill="none"
            stroke="currentColor"
            aria-hidden="true"
          >
            <path d="M16 12A7 7 0 0 1 8 3a7 7 0 1 0 8 9Z" /></svg
          >Dusk
        </button>
      </div>
    </header>
    <main id="main"></main>
    <!-- Photography attribution and licenses: photos/credits.html and photos/manifest.json.
       LA: Rachel L. Umstead, CC BY-SA 4.0. Houston: Carol M. Highsmith, public domain. -->
    <nav id="preview-nav" hidden aria-label="Preview screens"></nav>
    <script src="simple-motion.js?v=1"></script>
    <script src="tactile.js?v=1"></script>
    <script src="app.js?v=workspace-1"></script>
  </body>
</html>
